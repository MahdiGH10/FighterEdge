name: fighter_edge
description: "FIGHTER EDGE — Your Edge. Every Day. A dark, athletic MMA/fight-camp training app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  fl_chart: ^0.68.0
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  crypto: ^3.0.3
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  firebase_analytics: ^12.6.0
  firebase_crashlytics: ^5.4.0
  cloud_firestore: ^6.6.0
  cloud_functions: ^6.1.0
  go_router: ^17.5.0
  purchases_flutter: ^10.12.0
  url_launcher: ^6.3.2
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  flutter_tts: ^4.2.5
  wakelock_plus: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Generators only — they write static resource files at dev time and are
  # never compiled into the shipped app, so they carry none of the native
  # build risk a runtime plugin does.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/icon.png"
  # Matches AppColors.background exactly — the icon reads as part of the
  # app, not a sticker on top of a mismatched adaptive-icon background.
  adaptive_icon_background: "#09090D"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#09090D"
  image: assets/icon/foreground.png
  android_12:
    color: "#09090D"
    image: assets/icon/foreground.png
  web: false

flutter:
  # Generates lib/l10n/gen from the ARB files (see l10n.yaml).
  generate: true
  uses-material-design: true
  assets:
    - assets/images/login_background.png
    - assets/data/
  fonts:
    # Both faces are variable fonts. Declaring an explicit `weight:` would pin
    # the file to that single face and make every other weight a synthesized
    # fake; left undeclared, Flutter maps FontWeight onto the font's own `wght`
    # axis (Oswald 200-700, Inter 100-900).
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
