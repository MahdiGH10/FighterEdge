<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Fighter Edge V2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout concept: a review bench. Sticky toolbar (material + size), then three views:
   one live phone with a control panel, a gallery of every screen, and the design-system board.
   The phones are the product (dark only); the page around them follows the viewer theme. */
:root{
  /* page chrome tokens (dark first) */
  --pg-bg:#0C0B10; --pg-fg:#F1EEF5; --pg-muted:#A29CAE; --pg-panel:#16131D; --pg-line:rgba(255,255,255,.11);
  --pg-accent:#FF6A5E; --pg-seg:#211D2B;
  --font-display:'Oswald','Arial Narrow',Impact,sans-serif; --font-text:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;

  /* Fighter Edge V2 tokens (phones are dark only, so these never change with the page theme) */
  --fe-bg:#08070C; --fe-surface:#14121A; --fe-surface2:#1C1923; --fe-elev:#26222F;
  --fe-line:rgba(255,255,255,.09); --fe-line2:rgba(255,255,255,.16);
  --fe-text:#F7F5FA; --fe-text2:#BDB8C7; --fe-text3:#9892A5;
  --fe-crimson:#E0222B; --fe-crimson-deep:#B3121C; --fe-ember:#FF6A2B; --fe-ember-soft:#FF9248;
  --fe-accent-text:#FF6358; --fe-ramp:linear-gradient(90deg,#D8182A 0%,#FF6A2B 100%);
  --fe-cta:linear-gradient(180deg,#EC2B34 0%,#C7131E 100%);
  --fe-gold:#F2C879; --fe-gold-deep:#C9973F;
  --fe-danger:#FF4F7B; --fe-ok:#46C287; --fe-warn:#F5A623;
  --fe-protein:#B58CFF; --fe-carbs:#4A9EF0; --fe-fat:#F0A93B;
  --fe-glow-top:rgba(224,34,43,.55); --fe-glow-ember:rgba(255,106,43,.22); --fe-glow-low:rgba(58,44,196,.40);
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --pg-bg:#ECE9F0; --pg-fg:#1A1722; --pg-muted:#5B5567; --pg-panel:#FFFFFF; --pg-line:rgba(20,16,30,.14);
  --pg-accent:#B8161F; --pg-seg:#DDD8E4; color-scheme:light}}
:root[data-theme="light"]{
  --pg-bg:#ECE9F0; --pg-fg:#1A1722; --pg-muted:#5B5567; --pg-panel:#FFFFFF; --pg-line:rgba(20,16,30,.14);
  --pg-accent:#B8161F; --pg-seg:#DDD8E4; color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--pg-bg);color:var(--pg-fg);font:400 15px/1.5 var(--font-text);margin:0;padding-block:0 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--pg-bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--pg-accent);outline-offset:2px}
.wrap{max-width:1240px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- page toolbar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--pg-bg);border-bottom:1px solid var(--pg-line)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font:700 22px/1 var(--font-display);letter-spacing:.04em;text-transform:uppercase}
.brand b i{font-style:normal;color:var(--pg-accent)}
.brand span{color:var(--pg-muted);font-size:13px}
.seg{display:inline-flex;background:var(--pg-seg);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--pg-muted);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--pg-bg);color:var(--pg-fg);box-shadow:0 0 0 1px var(--pg-line)}
.lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--pg-muted);font-weight:600;margin-right:6px}
.tg{display:flex;align-items:center}

/* ---------- views ---------- */
.view{padding-block:28px}
.proto{display:grid;grid-template-columns:auto minmax(0,380px);gap:40px;justify-content:center;align-items:start}
.stage{display:flex;justify-content:center}
.panel{display:flex;flex-direction:column;gap:22px;min-width:0}
.panel h3{margin:0 0 8px;font:600 12px/1 var(--font-text);letter-spacing:.12em;text-transform:uppercase;color:var(--pg-muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--pg-line);background:none;border-radius:999px;padding:7px 12px;font-size:14px;min-height:36px}
.chips button[aria-pressed="true"]{background:var(--pg-fg);color:var(--pg-bg);border-color:var(--pg-fg)}
.jump{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.jump button{border:1px solid var(--pg-line);background:var(--pg-panel);border-radius:10px;text-align:left;padding:9px 12px;font-size:14px;min-height:40px}
.jump button[aria-pressed="true"]{border-color:var(--pg-accent)}
.hap{font:600 13px var(--font-text);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hap output{background:var(--pg-panel);border:1px solid var(--pg-line);border-radius:8px;padding:5px 10px;min-width:110px;display:inline-block}
.note-sm{color:var(--pg-muted);font-size:13px;line-height:1.5;margin:0}
@media (max-width:900px){.proto{grid-template-columns:minmax(0,1fr)}.panel{max-width:520px;margin-inline:auto;width:100%}}

.group{margin-block:8px 36px}
.group>h2{font:700 26px/1.1 var(--font-display);text-transform:uppercase;letter-spacing:.03em;margin:0 0 4px}
.group>p{margin:0 0 18px;color:var(--pg-muted);max-width:70ch}
.grid{display:flex;flex-wrap:wrap;gap:28px 24px;align-items:flex-start}
.shot{margin:0;display:flex;flex-direction:column;gap:10px}
.pair{display:flex;gap:12px}
.shot-frame{position:relative}
.shot-frame .phone-scale{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
.shot figcaption{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;font-size:13px;color:var(--pg-muted);max-width:var(--cw)}
.shot figcaption b{display:block;color:var(--pg-fg);font-size:14px}
.shot figcaption button{border:1px solid var(--pg-line);background:none;border-radius:8px;padding:5px 10px;font-size:12.5px;white-space:nowrap;min-height:30px}

/* ---------- phone ---------- */
.phone{position:relative;overflow:hidden;border-radius:46px;background:var(--fe-bg);color:var(--fe-text);font:400 16px/1.4 var(--font-text);
  container-type:inline-size;isolation:isolate;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 0 0 7px #000,0 0 0 8px rgba(255,255,255,.07);flex:none;-webkit-font-smoothing:antialiased}
.phone *{box-sizing:border-box}
.phone button{font-family:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.bg{position:absolute;inset:0;z-index:0;background:
  radial-gradient(120% 52% at 50% -14%,var(--fe-glow-top) 0%,var(--fe-glow-ember) 30%,rgba(224,34,43,0) 66%),
  radial-gradient(85% 38% at 0% 102%,var(--fe-glow-low) 0%,rgba(58,44,196,0) 72%),
  radial-gradient(55% 26% at 104% 84%,rgba(130,34,170,.17),rgba(130,34,170,0) 72%),var(--fe-bg)}
.solid .bg{background:var(--fe-bg)}
.scroll{position:absolute;inset:0;z-index:1;overflow-y:auto;overflow-x:hidden;padding:60px 20px calc(var(--dock-h,84px) + 24px);display:flex;flex-direction:column;gap:20px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll>*{flex:none}

/* navigation layer: the only place with real blur */
.topbar{position:absolute;top:0;left:0;right:0;height:100px;z-index:6;display:flex;align-items:flex-end;justify-content:center;padding-bottom:13px;
  font:700 18px/1 var(--font-display);letter-spacing:.08em;text-transform:uppercase;opacity:0;pointer-events:none;transition:opacity .22s ease;
  background:rgba(13,10,19,.78);-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);
  border-bottom:1px solid rgba(255,255,255,.10)}
.scrolled .topbar{opacity:1}
.solid .topbar{background:var(--fe-surface);-webkit-backdrop-filter:none;backdrop-filter:none}
.dock{position:absolute;left:0;right:0;bottom:0;z-index:6;padding-bottom:26px;
  background:rgba(13,10,19,.78);-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);
  border-top:1px solid rgba(255,255,255,.10);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.solid .dock{background:var(--fe-surface);-webkit-backdrop-filter:none;backdrop-filter:none}
.dock-action{padding:12px 20px;display:flex;gap:10px;align-items:center}
.dock-action.stack{flex-direction:column;align-items:stretch;gap:8px}
.dock-fine{font-size:12px;line-height:1.35;color:var(--fe-text3);text-align:center;margin:0}
.tabs{display:flex;height:56px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;color:var(--fe-text3);font:600 11px/1 var(--font-text);letter-spacing:.02em;position:relative}
.tab .ico{display:block}
.tab.on{color:var(--fe-text)}
.tab.on .f{fill:currentColor}
.tab.on svg{stroke-width:2.3}
.tab.on::before{content:"";position:absolute;top:0;width:24px;height:2px;border-radius:2px;background:var(--fe-ramp)}
.ico{flex:none}

/* sheets */
.scrim{position:absolute;inset:0;z-index:8;background:rgba(4,3,8,.55)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:9;border-radius:24px 24px 0 0;padding:8px 20px 30px;display:flex;flex-direction:column;gap:16px;
  background:rgba(27,23,37,.80);-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);
  border-top:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);max-height:86%;overflow:hidden}
.solid .sheet{background:var(--fe-elev);-webkit-backdrop-filter:none;backdrop-filter:none}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.28);margin:0 auto 4px}
.sheet h2{margin:0}
.sheet-body{overflow-y:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.sheet-body::-webkit-scrollbar{display:none}
.sheet-anim{animation:sheetUp .42s cubic-bezier(.2,1,.3,1) both}
.scrim-anim{animation:fadeIn .25s ease both}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* type */
.eyebrow{font:600 12px/16px var(--font-text);letter-spacing:.14em;text-transform:uppercase;color:var(--fe-text3)}
.eyebrow.ember{color:var(--fe-ember-soft)}
.eyebrow.gold{color:var(--fe-gold)}
.t-large{font:700 34px/1.06 var(--font-display);text-transform:uppercase;letter-spacing:.015em;margin:0}
.t-xl{font:700 40px/1.04 var(--font-display);text-transform:uppercase;letter-spacing:.015em;margin:0}
.t-display{font:700 52px/1.02 var(--font-display);text-transform:uppercase;letter-spacing:.012em;margin:0}
.t-title1{font:700 22px/1.2 var(--font-display);text-transform:uppercase;letter-spacing:.03em;margin:0}
.t-title2{font:700 18px/1.2 var(--font-display);text-transform:uppercase;letter-spacing:.04em;margin:0}
.t-num{font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.t-body{font:400 17px/1.4 var(--font-text)}
.t-sub{font:400 14px/1.4 var(--font-text);color:var(--fe-text2)}
.t-micro{font:500 12px/1.35 var(--font-text);color:var(--fe-text3)}
.c-ember{color:var(--fe-ember-soft)}.c-ok{color:var(--fe-ok)}.c-dim{color:var(--fe-text2)}.c-gold{color:var(--fe-gold)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column}

/* header */
.hdr{display:flex;flex-direction:column;gap:6px}
.hdr .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pills{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;font:700 12px/1 var(--font-text);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.pill.fight{background:rgba(224,34,43,.20);color:#FF8F86;box-shadow:inset 0 0 0 1px rgba(255,99,88,.35)}
.pill.trial{background:rgba(242,200,121,.14);color:var(--fe-gold);box-shadow:inset 0 0 0 1px rgba(242,200,121,.38)}
.pill.ok{background:rgba(70,194,135,.14);color:var(--fe-ok);box-shadow:inset 0 0 0 1px rgba(70,194,135,.35)}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;display:inline-flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);color:var(--fe-text)}
.solid .iconbtn{background:var(--fe-surface2)}

/* tinted glass hero (no backdrop blur) */
.hero{position:relative;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:12px;
  background:
   radial-gradient(130% 70% at 0% 0%,rgba(255,255,255,.075),rgba(255,255,255,0) 55%),
   linear-gradient(158deg,rgba(255,106,43,.10) 0%,rgba(110,18,30,.26) 40%,rgba(22,12,30,.50) 100%),
   rgba(12,8,16,.68);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -26px 44px -30px rgba(255,106,43,.20)}
.hero::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.14) 26%,rgba(255,255,255,.05) 58%,rgba(255,150,120,.34) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.hero.cool{background:
   radial-gradient(130% 70% at 0% 0%,rgba(255,255,255,.07),rgba(255,255,255,0) 55%),
   linear-gradient(158deg,rgba(120,100,255,.14) 0%,rgba(60,34,120,.26) 45%,rgba(18,12,30,.5) 100%),rgba(12,8,16,.68)}
.hero.gold{background:
   radial-gradient(130% 70% at 0% 0%,rgba(255,236,190,.10),rgba(255,236,190,0) 55%),
   linear-gradient(158deg,rgba(242,200,121,.14) 0%,rgba(120,80,30,.22) 45%,rgba(22,14,14,.52) 100%),rgba(12,8,16,.68)}
.hero.gold::before{background:linear-gradient(135deg,rgba(255,238,200,.7) 0%,rgba(242,200,121,.18) 30%,rgba(242,200,121,.06) 60%,rgba(242,200,121,.38) 100%)}
.solid .hero{background:var(--fe-surface2);box-shadow:none}
.solid .hero::before{background:var(--fe-line2)}
.hero .meta{margin:0;font:500 16px/1.35 var(--font-text);color:var(--fe-text2)}
.hero .note{margin:0;display:flex;gap:8px;align-items:flex-start;font:500 14px/1.4 var(--font-text);color:var(--fe-text2)}
.hero .note .ico{margin-top:1px;color:var(--fe-ember-soft)}
.glyph{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);color:var(--fe-text);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.solid .glyph{background:var(--fe-elev)}

/* buttons */
.btn{height:52px;min-height:48px;border-radius:14px;border:0;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font:700 16px/1 var(--font-text);letter-spacing:.03em;color:#fff;text-align:center}
.btn.primary{background:var(--fe-cta);box-shadow:inset 0 1px 0 rgba(255,255,255,.26),inset 0 -1px 0 rgba(0,0,0,.18)}
.btn.ghost{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.solid .btn.ghost{background:var(--fe-surface2)}
.btn.text{background:none;color:var(--fe-accent-text);height:44px;width:auto;padding:0 8px}
.btn.gold{background:linear-gradient(180deg,#F6D28D,#D9A850);color:#2A1B05;box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.btn[disabled]{opacity:.45}
.btn:active{transform:scale(.985)}
.btn.small{height:44px;width:auto;padding:0 18px;font-size:14px}

/* rows and lists (crisp, no boxes) */
.sect{display:flex;flex-direction:column;gap:6px}
.sect>.eyebrow{padding-bottom:2px}
.rowitem{display:flex;align-items:center;gap:14px;min-height:56px;padding:8px 0;border-bottom:1px solid var(--fe-line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.rowitem:last-child{border-bottom:0}
.rowitem .rt{font:600 17px/1.25 var(--font-text);color:var(--fe-text)}
.rowitem .rs{font:400 14px/1.35 var(--font-text);color:var(--fe-text2)}
.rowitem .chev{color:var(--fe-text3);margin-left:auto}
.linkrow{display:flex;align-items:center;gap:10px;min-height:52px;border:0;border-top:1px solid var(--fe-line);background:none;width:100%;text-align:left;padding:10px 0}
.group-solid{background:var(--fe-surface);border-radius:16px;padding:2px 16px;box-shadow:inset 0 0 0 1px var(--fe-line)}
.group-solid .rowitem{border-bottom:1px solid var(--fe-line)}
.group-solid .rowitem:last-child{border-bottom:0}
.qa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--fe-surface);border-radius:16px;box-shadow:inset 0 0 0 1px var(--fe-line)}
.qa button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px 4px;min-height:68px;font:600 14px/1.1 var(--font-text);color:var(--fe-text)}
.qa button+button{border-left:1px solid var(--fe-line)}
.qa small{font:500 12px/1 var(--font-text);color:var(--fe-text3)}
.qa .ico{color:var(--fe-ember-soft)}
.qa.locked button{opacity:.5}

/* week strip */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.sd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 7px;border-radius:18px;position:relative}
.sd .sl{font:600 11px/1 var(--font-text);letter-spacing:.1em;color:var(--fe-text3)}
.sd .sn{font:600 12px/1 var(--font-text);color:var(--fe-text3);font-variant-numeric:tabular-nums}
.node{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;color:var(--fe-text3);
  transition:background .28s cubic-bezier(.2,1.2,.4,1),transform .34s cubic-bezier(.2,1.5,.4,1),box-shadow .28s ease,color .2s ease}
.sd.planned .node{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.30)}
.sd.rest .node{box-shadow:none}
.sd.rest .node::after{content:"";width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.28)}
.sd.rest .node svg{display:none}
.sd.missed .node{border:1.5px dashed rgba(255,255,255,.28)}
.sd.moved .node{border:1.5px dashed rgba(255,255,255,.38);color:var(--fe-text2)}
.sd.done .node{background:var(--fe-ramp);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.sd.today{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.10)}
.sd.today .sl,.sd.today .sn{color:var(--fe-text)}
.sd.today .node{box-shadow:inset 0 0 0 2px var(--fe-crimson);color:var(--fe-accent-text);background:rgba(224,34,43,.14)}
.sd.today.done .node{background:var(--fe-ramp);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3);transform:scale(1.04)}
.solid .sd.today{background:var(--fe-elev)}
.sd.fight .node{background:rgba(224,34,43,.26);box-shadow:inset 0 0 0 1.5px var(--fe-crimson);color:#FFB3AC}
.sd.moved.planned .node{box-shadow:none}

/* fuel */
.kcal{display:flex;align-items:center;justify-content:space-between;gap:12px}
.kcal .big{font:700 76px/.95 var(--font-display);letter-spacing:.005em;font-variant-numeric:tabular-nums}
.kcal .lab{font:600 12px/1.2 var(--font-text);letter-spacing:.14em;text-transform:uppercase;color:var(--fe-text2);margin-top:6px}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{display:block}

const FE = (function () {

  /* ---------- shared components ---------- */

  // st: planned | done | today | today done | rest | missed | moved | fight
  function strip(days) {
    return `<div class="strip" role="img" aria-label="Week progress">${days.map((x, i) => {
      const done = /\bdone\b/.test(x.st), moved = /moved/.test(x.st);
      let inner = '';
      if (done) inner = ico('check', 18);
      else if (moved) inner = ico('arrow', 16);
      else if (x.g) inner = ico(x.g, 18);
      return `<div class="sd ${x.st}"><span class="sl">${DL[i]}</span><span class="node">${inner}</span><span class="sn">${x.d}</span></div>`;
    }).join('')}</div>`;
  }
  const W_TRAIN = [{ st: 'done', d: 19 }, { st: 'done', d: 20 }, { st: 'done', d: 21 }, { st: 'today', d: 22, g: 'wrestling' }, { st: 'rest', d: 23 }, { st: 'planned', d: 24, g: 'striking' }, { st: 'rest', d: 25 }];
  const W_DONE = [{ st: 'done', d: 19 }, { st: 'done', d: 20 }, { st: 'done', d: 21 }, { st: 'today done', d: 22 }, { st: 'rest', d: 23 }, { st: 'planned', d: 24, g: 'striking' }, { st: 'rest', d: 25 }];
  const W_REC = [{ st: 'done', d: 19 }, { st: 'done', d: 20 }, { st: 'done', d: 21 }, { st: 'done', d: 22 }, { st: 'today', d: 23, g: 'moon' }, { st: 'planned', d: 24, g: 'striking' }, { st: 'rest', d: 25 }];
  const W_FIGHT = [{ st: 'done', d: 23 }, { st: 'done', d: 24 }, { st: 'today', d: 25, g: 'striking' }, { st: 'planned', d: 26, g: 'moon' }, { st: 'planned', d: 27, g: 'scale' }, { st: 'planned', d: 28, g: 'scale' }, { st: 'fight', d: 29, g: 'striking' }];
  const W_MISS = [{ st: 'done', d: 19 }, { st: 'missed', d: 20 }, { st: 'done', d: 21 }, { st: 'today', d: 22, g: 'wrestling' }, { st: 'moved planned', d: 23, g: 'striking' }, { st: 'moved', d: 24 }, { st: 'rest', d: 25 }];
  const W_REVIEW = [{ st: 'done', d: 19 }, { st: 'done', d: 20 }, { st: 'done', d: 21 }, { st: 'done', d: 22 }, { st: 'rest', d: 23 }, { st: 'missed', d: 24 }, { st: 'today', d: 25, g: 'moon' }];

  const heroBtn = (cls, a, inner) => `<button type="button" class="hero ${cls}" ${act(a)} style="width:100%;border:0;text-align:left;color:inherit;font:inherit;cursor:pointer">${inner}</button>`;
  const fmtN = (n) => n.toLocaleString('en-US');

  function header(eyebrow, title, right, extra) {
    return `<header class="hdr"><div class="eyebrow">${eyebrow}</div><div class="top"><h1 class="t-large">${title}</h1>${right || ''}</div>${extra || ''}</header>`;
  }
  const fightPill = (t) => `<span class="pill fight">${t}</span>`;

  function weekCard(label, big, next, days, a) {
    return heroBtn('cool', a || 'tab:train', `
      <div class="row between"><span class="eyebrow">${label}</span><span class="row c-dim" style="font:600 13px var(--font-text);gap:2px">Train ${ico('chev', 16)}</span></div>
      <div class="col" style="gap:2px"><div class="t-xl">${big}</div><p class="meta">${next}</p></div>
      ${strip(days)}`);
  }
  function fuelLine(kcal, pro) {
    return `<button type="button" class="linkrow" ${act('tab:fuel')}>${ico('fuel', 20, 'c-ember')}<span class="grow t-sub" style="color:var(--fe-text)"><b class="t-num" style="font-size:20px">${fmtN(kcal)}</b> kcal left · protein <b class="t-num" style="font-size:20px">${pro} g</b> left</span><span class="c-dim">${ico('chev', 18)}</span></button>`;
  }
  function quick(w, locked) {
    return `<div class="qa ${locked ? 'locked' : ''}"><button type="button">${ico('scale', 22)}Weigh in<small>${w}</small></button><button type="button" ${locked ? '' : act('sheet:food')}>${ico('fuel', 22)}Log food<small>${locked ? 'Locked' : 'Quick add'}</small></button><button type="button">${ico('timer', 22)}Timer<small>Free round</small></button></div>`;
  }
  function addFightRow() {
    return `<button type="button" class="linkrow">${ico('flag', 20, 'c-ember')}<span class="grow"><b style="font:600 16px var(--font-text)">Add your fight</b><br><span class="t-sub">Get a countdown and a safe weight path.</span></span><span class="c-dim">${ico('chev', 18)}</span></button>`;
  }

  /* ---------- HOME (6 states) ---------- */
  function home(o) {
    const s = o.home || 'training';
    const fk = o.fuel || { kcal: 2140, pro: 92 };
    let body = [], title = 'Today';
    if (s === 'training' || s === 'trial' || s === 'readonly') {
      const ro = s === 'readonly';
      const trial = s === 'trial' ? `<div class="pills"><span class="pill trial">${ico('star', 14)} Free week · 5 days left</span></div>` : '';
      body.push(header('Thursday, Oct 22 · Camp week 3', 'Today', fightPill('38 days to fight'), trial));
      if (ro) body.push(`<div class="ro">${ico('lock', 22)}<span class="grow">Your free week ended. Your plan and logs stay readable.</span><b>Continue</b></div>`);
      body.push(`<section class="hero today" style="${ro ? 'opacity:.9' : ''}">
        <div class="row between"><span class="eyebrow ember">Today · Session 4 of 5</span><span class="glyph">${ico('wrestling', 22)}</span></div>
        <h2 class="t-display">Wrestling</h2>
        <p class="meta">6 rounds · about 50 min</p>
        <p class="note">${ico('fuel', 16)}<span>Hard day. Carbs +60 g, ${fmtN(fk.kcal)} kcal left.</span></p>
        ${ro ? `<button type="button" class="btn primary" ${act('go:paywall')}>Continue with Pro</button><button type="button" class="btn ghost" disabled style="height:48px">${ico('lock', 16)} Start session</button>`
             : `<button type="button" class="btn primary" ${act('go:session')}>${ico('play', 18)} Start session</button>`}
      </section>`);
      body.push(quick('79.8 kg', ro));
      body.push(weekCard('This week', '3 of 5 done', 'Next: Thu Wrestling, today', W_TRAIN));
      body.push(fuelLine(fk.kcal, fk.pro));
    } else if (s === 'done') {
      body.push(header('Thursday, Oct 22 · Camp week 3', 'Today', fightPill('38 days to fight')));
      body.push(`<section class="hero today">
        <div class="row between"><span class="eyebrow c-ok">Today · Done</span><span class="glyph" style="color:var(--fe-ok)">${ico('check', 22)}</span></div>
        <h2 class="t-xl">Wrestling done</h2>
        <p class="meta">52 min · 6 rounds · effort 8</p>
        <p class="note">${ico('fuel', 16)}<span>Eat for recovery. Protein ${fk.pro} g left.</span></p>
        <button type="button" class="btn primary" ${act('sheet:food')}>${ico('plus', 18)} Log food</button>
      </section>`);
      body.push(quick('79.8 kg'));
      body.push(weekCard('This week', '4 of 5 done', 'Next: Sat Striking', W_DONE));
      body.push(fuelLine(fk.kcal, fk.pro));
    } else if (s === 'recovery') {
      body.push(header('Friday, Oct 23 · Camp week 3', 'Today'));
      body.push(`<section class="hero today">
        <div class="row between"><span class="eyebrow ember">Today · Recovery</span><span class="glyph">${ico('moon', 22)}</span></div>
        <h2 class="t-title1" style="font-size:30px">Recovery day</h2>
        <p class="meta">Light mobility, 10 minutes. Rest is part of the plan. Nothing to catch up.</p>
        <p class="note">${ico('fuel', 16)}<span>Lighter day. Carbs −60 g, ${fmtN(2420)} kcal target.</span></p>
        <button type="button" class="btn primary">${ico('scale', 18)} Log weigh-in</button>
      </section>`);
      body.push(quick('79.8 kg'));
      body.push(weekCard('This week', '4 of 5 done', 'Next: Sat Striking', W_REC));
      body.push(fuelLine(2420, 140));
      body.push(addFightRow());
    } else if (s === 'fight') {
      title = 'Today';
      body.push(header('Wednesday, Nov 25 · Camp week 8', 'Today', fightPill('4 days to fight')));
      body.push(`<section class="hero today">
        <div class="row between"><span class="eyebrow ember">Fight week</span><span class="pill ok">${ico('check', 14)} On a safe path</span></div>
        <h2 class="t-display">Weigh-in<br>in 3 days</h2>
        <p class="meta">Sat Nov 28 · limit 77.0 kg · now 77.6 kg</p>
        <p class="note">${ico('scale', 16)}<span>Today's step: hold weight, eat 2,350 kcal, drink normally. 0.6 kg to go.</span></p>
        <button type="button" class="btn primary">Open fight week plan</button>
      </section>`);
      body.push(`<div class="row" style="gap:14px"><span class="glyph">${ico('striking', 22)}</span><div class="grow"><div style="font:600 17px var(--font-text)">Also today: light striking</div><div class="t-sub">4 rounds · about 30 min</div></div><button type="button" class="btn text" ${act('go:session')}>Start</button></div>`);
      body.push(quick('77.6 kg'));
      body.push(weekCard('Fight week', '2 of 4 done', 'Next: Wed Light striking, today', W_FIGHT));
    }
    return { title, body: body.join(''), tabs: 'home', dockH: 82 };
  }

  /* ---------- TRAIN ---------- */
  const stOk = (t) => `<span class="st ok">${ico('check', 16)} ${t}</span>`;
  function wrow(cls, dow, d, t, m, st) {
    return `<div class="wr ${cls}"><div class="dt">${dow}<b>${d}</b></div><div><div class="tt">${t}</div><div class="ms">${m}</div></div><div>${st || ''}</div></div>`;
  }
  function train(o) {
    const miss = o.trainVar === 'missed';
    const rows = miss ? [
      wrow('past', 'MON', 19, 'Striking', '6 rounds · 52 min', stOk('RPE 8')),
      wrow('missed', 'TUE', 20, 'BJJ', 'Missed. Still open this week.', `<button type="button" class="st act" style="background:none;border:0;min-height:44px">Move to today</button>`),
      wrow('past', 'WED', 21, 'Conditioning', 'Intervals + core · 38 min', stOk('RPE 7')),
      wrow('today', 'THU', 22, 'Wrestling', '6 rounds · about 50 min', '<span class="tag today">Today</span>'),
      wrow('', 'FRI', 23, 'Striking', 'Moved from Sat · 6 rounds', ''),
      wrow('past missed', 'SAT', 24, 'Striking', 'Moved to Fri', `<span class="st">${ico('arrow', 14)} Fri</span>`),
      wrow('', 'SUN', 25, 'Rest', 'Nothing planned', '')
    ] : [
      wrow('past', 'MON', 19, 'Striking', '6 rounds · 52 min', stOk('RPE 8')),
      wrow('past', 'TUE', 20, 'BJJ', 'Guard passing · 60 min', stOk('RPE 7')),
      wrow('past', 'WED', 21, 'Conditioning', 'Intervals + core · 38 min', stOk('RPE 7')),
      wrow('today', 'THU', 22, 'Wrestling', '6 rounds · about 50 min', '<span class="tag today">Today</span>'),
      wrow('', 'FRI', 23, 'Recovery', 'Mobility, 10 min', ''),
      wrow('', 'SAT', 24, 'Striking', '6 rounds · about 45 min', ''),
      wrow('', 'SUN', 25, 'Rest', 'Nothing planned', '')
    ];
    const body = [
      header('Camp · Week 3 · Oct 19 to 25', 'Train', `<button type="button" class="iconbtn" ${act('sheet:log')} aria-label="Log a session">${ico('plus', 22)}</button>`),
      `<div class="seg2"><button type="button" class="on">Week</button><button type="button">Drills</button></div>`,
      `<div class="col" style="gap:8px"><div class="row between"><span class="t-title2">${miss ? '2' : '3'} of 5 done</span><span class="t-micro">Rest days never count against you</span></div>${strip(miss ? W_MISS : W_TRAIN)}</div>`,
      `<section class="hero today"><div class="row between"><span class="eyebrow ember">Today</span><span class="glyph">${ico('wrestling', 22)}</span></div><h2 class="t-display">Wrestling</h2><p class="meta">6 rounds · about 50 min</p><button type="button" class="btn primary" ${act('go:session')}>${ico('play', 18)} Start session</button></section>`,
      `<div class="sect"><div class="eyebrow">This week</div><div class="wk">${rows.join('')}</div></div>`,
      `<div class="sect" style="margin-top:-6px"><button type="button" class="linkrow">${ico('timer', 20, 'c-ember')}<span class="grow"><b style="font:600 16px var(--font-text)">Timer</b><br><span class="t-sub">Free rounds, not tied to a session</span></span><span class="c-dim">${ico('chev', 18)}</span></button>
       <button type="button" class="linkrow" ${act('go:review')}>${ico('book', 20, 'c-ember')}<span class="grow"><b style="font:600 16px var(--font-text)">Sunday review</b><br><span class="t-sub">Week 3 is ready to review</span></span><span class="c-dim">${ico('chev', 18)}</span></button>
       <button type="button" class="linkrow"><span class="grow"><b style="font:600 16px var(--font-text)">Past weeks</b></span><span class="c-dim">${ico('chev', 18)}</span></button></div>`
    ];
    return { title: 'Train', body: body.join(''), tabs: 'train', dockH: 82 };
  }

  /* ---------- SESSION MODE ---------- */
  const CUES = [
    ['Stance, level change, shoot', 'Stay low. Eyes up.'],
    ['Single leg, chain, finish', 'Hips in, head up. Drive through the leg.'],
    ['Double leg, then sprawl', 'Penetration step, then hips back fast.'],
    ['Body lock, then trip', 'Squeeze tight. Turn the corner.'],
    ['Snap down, front headlock', 'Pull the head to your chest.'],
    ['Live wrestling at 70 percent', 'Breathe. Pick one finish and chase it.']
  ];
  const digits = (sec) => {
    const m = Math.floor(sec / 60), r = sec % 60, f = [Math.floor(m / 10), m % 10, ':', Math.floor(r / 10), r % 10];
    return f.map((c) => c === ':' ? '<span class="c">:</span>' : `<span class="d">${c}</span>`).join('');
  };
  function session(o) {
    const ss = o.sess || { round: 2, left: 157, running: true, phase: 'work', total: 180, elapsed: 845 };
    const rest = ss.phase === 'rest', paused = !ss.running;
    const prog = Math.max(0, Math.min(1, 1 - ss.left / ss.total));
    const pips = Array.from({ length: 6 }, (_, i) => i + 1 < ss.round ? '<i class="done"></i>' : i + 1 === ss.round ? `<i class="cur" style="--p:${Math.round(prog * 100)}%"></i>` : '<i></i>').join('');
    const cue = CUES[Math.min(ss.round, 6) - 1];
    const nxt = rest ? `Round ${Math.min(ss.round + 1, 6)}: ${CUES[Math.min(ss.round, 5)][0]}` : (ss.round >= 6 ? 'Finish. Cool down 3 min.' : `Rest 0:30, then ${CUES[ss.round][0].toLowerCase()}`);
    const phaseCls = paused ? 'paused' : rest ? 'rest' : 'work';
    const phaseTxt = paused ? 'Paused' : rest ? 'Rest' : 'Work';
    const plan = CUES.map((c, i) => ({ n: i + 1, c })).filter((x) => x.n > ss.round).map((x) => `<div class="rp"><b>${x.n}</b><span>${x.c[0]}<small>${x.c[1]}</small></span></div>`).join('');
    const body = `
      <div class="row between"><button type="button" class="iconbtn" ${act('sheet:complete')} aria-label="Close session">${ico('x', 20)}</button><span class="eyebrow">Wrestling · Session 4 of 5</span><button type="button" class="btn text" ${act('sheet:complete')} style="min-width:44px">Finish</button></div>
      <div class="sess" style="margin-top:2px">
        <div class="col" style="gap:10px"><div class="row between"><h1 class="t-large" style="font-size:30px">Round ${ss.round} of 6</h1><span class="t-micro t-num" style="font-size:14px;color:var(--fe-text2)">${Math.floor(ss.elapsed / 60)}:${String(ss.elapsed % 60).padStart(2, '0')} in</span></div><div class="pips">${pips}</div></div>
        <div class="phase ${phaseCls}" style="margin-top:8px"><i></i><span data-phase>${phaseTxt}</span></div>
        <div class="timer ${paused ? 'paused' : ''}" data-timer role="timer" aria-label="Time left in round">${digits(ss.left)}</div>
        <div class="col" style="gap:6px;margin-top:4px"><h2 class="cue">${rest ? 'Shake it out. Breathe.' : cue[0]}</h2><p class="cue-sub">${rest ? 'Water if you need it. Next round starts soon.' : cue[1]}</p></div>
        <div class="nextline"><b>Next</b><span>${nxt}</span></div>
      </div>
      <div class="sect" style="margin-top:6px"><div class="eyebrow">Coming up</div>${plan}</div>`;
    const dock = `<div class="ctl"><button type="button" class="btn ghost side" ${act('skip')} aria-label="Skip round">${ico('skip', 24)}</button><button type="button" class="btn primary" ${act('pause')}>${paused ? ico('play', 22) + ' Resume' : ico('pause', 22) + ' Pause'}</button></div>`;
    return { title: 'Wrestling', body, tabs: null, action: dock, actionRaw: true, dockH: 122, noTop: true };
  }
  function completeSheet(o) {
    const eff = o.eff;
    const strp = W_TRAIN.map((x, i) => i === 3 && eff ? { st: 'today done', d: 22 } : x);
    return `<div class="scrim scrim-anim"></div><div class="sheet sheet-anim"><div class="grab"></div>
      <div class="col" style="gap:4px"><div class="eyebrow ember">Wrestling</div><h2 class="t-xl">Session complete</h2><div class="t-sub" style="font-size:16px">52 min · 6 rounds</div></div>
      <div class="col" style="gap:10px"><div class="t-title2">How hard was it?</div>
        <div class="eff">${[5, 6, 7, 8, 9, 10].map((n) => `<button type="button" class="${eff === n ? 'on' : ''}" ${act('eff:' + n)} aria-pressed="${eff === n}">${n}</button>`).join('')}</div>
        <div class="effscale"><span>5 Easy</span><span>10 All out</span></div></div>
      <div class="col" style="gap:6px"><div class="row between"><span class="t-title2">${eff ? '4' : '3'} of 5 done</span><span class="t-micro">${eff ? 'Next: Sat Striking' : 'Pick effort to add this one'}</span></div>${strip(strp)}</div>
      <button type="button" class="btn primary" ${eff ? act('finishDone') : 'disabled'}>Done</button></div>`;
  }

  /* ---------- WEEKLY REVIEW ---------- */
  function review(o) {
    const r = o.rev || 'pending';
    const body = [
      header('Camp · Sunday · Week 3', 'Week review'),
      `<div class="col" style="gap:8px"><div class="row between"><span class="t-title2">4 of 5 done</span><span class="t-micro">The missed one is not a failure</span></div>${strip(W_REVIEW)}</div>`,
      `<div class="nums">
        <div><div class="eyebrow">Sessions</div><div class="nv">4<small>of 5</small></div><div class="nd">Striking missed Sat</div></div>
        <div><div class="eyebrow">Protein days</div><div class="nv">5<small>of 7</small></div><div class="nd">Hit 130 g or more</div></div>
        <div><div class="eyebrow">Average intake</div><div class="nv">2,640<small>kcal</small></div><div class="nd">Target 2,700</div></div>
        <div><div class="eyebrow">Weight trend</div><div class="nv">−0.6<small>kg</small></div><div class="nd">Plan was −0.5 kg</div></div>
      </div>`,
      r === 'pending' ? `<section class="hero today">
        <div class="eyebrow ember">Recommended change</div>
        <h2 class="t-title1" style="font-size:24px">Add 100 kcal on training days</h2>
        <div class="oldnew"><span class="o">2,900</span>${ico('arrow', 24)}<span>3,000</span><small>kcal</small></div>
        <p class="meta" style="font-size:15px">You lost a little faster than your path and ate under target 3 days. A small raise keeps you on the path and keeps sessions fed. Rest days stay at 2,420.</p>
      </section>` : `<section class="hero today fade-in"><span class="toast" style="${r === 'kept' ? 'background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);color:var(--fe-text2)' : ''}">${ico('check', 16)} ${r === 'accepted' ? 'Accepted' : 'Kept current'}</span>
        <h2 class="t-title1" style="font-size:24px">${r === 'accepted' ? 'Training days are 3,000 kcal from Monday' : 'Targets stay as they are'}</h2>
        <p class="meta" style="font-size:15px">${r === 'accepted' ? 'Rest days stay at 2,420 kcal. You can change this any time in Fuel.' : 'We will look again next Sunday. Nothing changes until you say so.'}</p></section>`,
      `<p class="t-micro">Targets are estimates, not medical advice.</p>`
    ];
    const action = r === 'pending'
      ? `<div class="dock-action"><button type="button" class="btn ghost" style="flex:1" ${act('rev:kept')}>Keep current</button><button type="button" class="btn primary" style="flex:1.2" ${act('rev:accepted')}>Accept</button></div>`
      : `<div class="dock-action"><button type="button" class="btn primary" ${act('tab:home')}>Back to Home</button></div>`;
    return { title: 'Week review', body: body.join(''), tabs: null, action, actionRaw: true, dockH: 90, back: true };
  }

  /* ---------- FUEL ---------- */
  function ring(p) {
    const r = 42, c = 2 * Math.PI * r;
    return `<div class="ring"><svg width="96" height="96" viewBox="0 0 96 96" aria-hidden="true"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D8182A"/><stop offset="1" stop-color="#FF8A3D"/></linearGradient></defs><circle cx="48" cy="48" r="${r}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="7"/><circle cx="48" cy="48" r="${r}" fill="none" stroke="url(#rg)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(c * p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 48 48)"/></svg><div class="inner">${Math.round(p * 100)}%<small>eaten</small></div></div>`;
  }
  const macro = (n, left, tgt, col, eaten) => `<div class="macro"><span class="n">${n}</span><span class="bar"><i style="width:${Math.min(100, Math.round(eaten / tgt * 100))}%;background:${col}"></i></span><span class="v" style="color:${col}" data-macro="${n}">${left}<small>g left</small></span></div>`;
  function fuel(o) {
    const f = o.fuel || { kcal: 2140, pro: 92, carb: 287, fat: 69, logged: [] };
    const eatenKcal = 2900 - f.kcal;
    const meals = [`<button type="button" class="rowitem"><span class="grow"><div class="rt">Breakfast</div><div class="rs">Oats, 2 eggs, banana, whey</div></span><span class="t-num" style="font-size:18px">760<small style="font:500 13px var(--font-text);color:var(--fe-text2);margin-left:3px">kcal</small></span>${ico('chev', 18, 'chev')}</button>`]
      .concat((f.logged || []).map((l) => `<button type="button" class="rowitem fade-in"><span class="grow"><div class="rt">${l.n}</div><div class="rs">${l.s}</div></span><span class="t-num" style="font-size:18px">${l.k}<small style="font:500 13px var(--font-text);color:var(--fe-text2);margin-left:3px">kcal</small></span></button>`));
    const body = [
      header('Thursday, Oct 22', 'Fuel', `<div class="row" style="gap:0;background:rgba(255,255,255,.07);border-radius:999px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)"><button type="button" class="iconbtn" style="background:none;box-shadow:none;width:40px;height:40px" aria-label="Previous day">${ico('chevl', 18)}</button><span style="font:600 14px var(--font-text);padding:0 4px">Today</span><button type="button" class="iconbtn" style="background:none;box-shadow:none;width:40px;height:40px;opacity:.4" aria-label="Next day">${ico('chev', 18)}</button></div>`),

    ];
    return `<div class="ds">

            <tr><td>Hero tint</td><td>Today card, weekly target card, review recommendation</td><td>No blur. Base <code>rgba(12,8,16,.68)</code> + 158° tint (ember .10, crimson .26, dark .50). 1 px rim 135°: .62 top-left to .05 mid to .34 bottom-right. Inset light <code>.12</code> top, ember .20 bottom. Radius 24</td></tr>
            <tr><td>Solid fallback</td><td>Reduce transparency, high contrast, slow frames</td><td>Nav <code>#14121A</code>, hero <code>#1C1923</code> + 1 px <code>.16</code> line, sheet <code>#26222F</code>, no glow, same layout</td></tr>
            <tr><td>Budget</td><td>Per screen</td><td>At most 2 or 3 blurs, never in list rows, never animated</td></tr></tbody></table></div></div>
        </div>
        <h3 style="font:600 13px var(--font-text);letter-spacing:.1em;text-transform:uppercase;color:var(--pg-muted);margin:22px 0 8px">Measured contrast (WCAG 2.x) on glass at the brightest glow, and on the solid fallback</h3>
        <div class="ds-card"><div class="tbl-wrap"><table class="tbl"><thead>${gthead}</thead><tbody>${grow}</tbody></table></div></div>
        <p class="note-sm" style="margin-top:10px"><b>Worst case on purpose:</b> the Today card is assumed to sit on the crimson glow core (alpha .55), with the top-left highlight on. In the real layouts the cards sit below the core, so these are lower bounds. <b>Rule that comes out of it:</b> on glass, text uses Text, Text 2, Ember soft, Gold or Done green. Text 3, Accent text and Danger go on the ground or on solid surfaces, or at 18 px bold and above. Failing cells: ${window.__GLASS_FAILS.length ? window.__GLASS_FAILS.join('; ') : 'none'}.</p>
      </section>

      <section><h2>Type scale</h2>
        <div class="specimen"><div class="tbl-wrap"><table class="tbl" style="color:var(--fe-text)"><thead><tr><th>Role</th><th>Spec</th><th>Use</th><th>Specimen</th></tr></thead><tbody>
          ${typ.map((t) => `<tr><td>${t[0]}</td><td style="color:var(--fe-text2)">${t[1]}</td><td style="color:var(--fe-text2)">${t[2]}</td><td>${tspec(t[3])}</td></tr>`).join('')}</tbody></table></div></div>
      </section>

      <section><h2>Radii, spacing, targets</h2>
        <div class="two"><div class="ds-card"><div style="display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end">
          ${[[24, 'Hero, sheet'], [16, 'Grouped list, quick row'], [14, 'Buttons, fields'], [10, 'Small tiles'], [999, 'Chips, pills']].map(([r, l]) => `<div style="text-align:center;font-size:12.5px;color:var(--pg-muted)"><div style="width:76px;height:76px;background:var(--fe-surface2);border:1px solid var(--pg-line);border-radius:${r}px;margin-bottom:6px"></div><b style="color:var(--pg-fg)">${r === 999 ? 'Pill' : r}</b><br>${l}</div>`).join('')}</div></div>
        <div class="ds-card"><p class="note-sm" style="margin:0 0 8px"><b>Spacing:</b> 4 · 8 · 12 · 16 · 20 · 28 · 40. Screen gutter 20 (16 at 320 wide). Gap between blocks 20.</p><p class="note-sm" style="margin:0 0 8px"><b>Targets:</b> 48 px minimum high, 44 px circle buttons, the primary action 52 px and anchored in the safe area. Session mode pause is 64 px.</p><p class="note-sm" style="margin:0"><b>Containers:</b> Home 7 → 3, Train 5 or 6 → 2 (today block and one strip), Fuel 2 → 0 boxes plus a meals list. Rows and type do the rest.</p></div></div>
      </section>

      <section><h2>Week strip, one component</h2>
        <div class="two"><div class="specimen">${strips}</div>
        <div class="ds-card"><div class="tbl-wrap"><table class="tbl"><tbody>
          <tr><td>Done</td><td>Crimson to ember fill, white check</td></tr><tr><td>Today</td><td>Crimson ring, soft pill behind the column</td></tr>
          <tr><td>Planned</td><td>Hollow ring with the discipline glyph</td></tr><tr><td>Rest</td><td>A small dot. Never at risk</td></tr>
          <tr><td>Missed</td><td>Dashed, muted. Row offers Move to today</td></tr><tr><td>Moved</td><td>Dashed with an arrow, shown where it went</td></tr>
          <tr><td>Fight</td><td>Crimson tinted node on the fight date</td></tr></tbody></table></div></div></div>
      </section>

      <section><h2>Motion</h2>
        <div class="ds-card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Moment</th><th>What moves</th><th>Time</th><th>Reduced motion</th></tr></thead><tbody>${motion.map((m) => `<tr><td><b>${m[0]}</b></td><td>${m[1]}</td><td>${m[2]}</td><td>${m[3]}</td></tr>`).join('')}</tbody></table></div></div>
      </section>

      <section><h2>Haptic map</h2>
        <div class="ds-card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Haptic</th><th>Fires on</th></tr></thead><tbody>${hapt.map((m) => `<tr><td><b>${m[0]}</b></td><td>${m[1]}</td></tr>`).join('')}</tbody></table></div><p class="note-sm" style="margin-top:10px">The prototype panel shows which haptic each action would fire.</p></div>
      </section>

      <section><h2>Contrast, solid colours</h2>
        <p class="lead">Calculated live from the token values with the WCAG formula.</p>
        <div class="ds-card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Pair</th><th>Colours</th><th>Ratio</th><th>Verdict</th></tr></thead><tbody>${crow}</tbody></table></div></div>
      </section>
    </div>`;
  }

  /* ---------- toolbar and views ---------- */
  function syncToolbar() {
    $$('#viewseg button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.view === S.view));
    $$('#matseg button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.mat === S.mat));
  }
  function setView(v) {
    S.view = v;
    ['proto', 'screens', 'system'].forEach((k) => { $('#v-' + k).hidden = k !== v; });
    syncToolbar();
    if (v === 'proto') renderStage();
    if (v === 'screens') renderGallery();
    if (v === 'system' && !$('#v-system').innerHTML) $('#v-system').innerHTML = systemBoard();
    try { history.replaceState(null, '', '#' + v); } catch (e) {}
    window.scrollTo(0, 0);
  }
  $('#viewseg').addEventListener('click', (e) => { const b = e.target.closest('[data-view]'); if (b) setView(b.dataset.view); });
  $('#matseg').addEventListener('click', (e) => {
    const b = e.target.closest('[data-mat]'); if (!b) return;
    S.mat = b.dataset.mat; syncToolbar();
    if (S.view === 'proto') renderStage(); else if (S.view === 'screens') renderGallery();
  });
  addEventListener('resize', () => { if (S.view === 'proto') renderStage(); });

  const h = (location.hash || '').replace('#', '');
  const q = new URLSearchParams(location.search);
  setView(['proto', 'screens', 'system'].includes(h) ? h : 'proto');
  window.__S = S; window.__setView = setView; window.__act = act;
})();
</script>

</body></html>
