# Gradle and the Kotlin compiler daemon each get their own heap. With 8G for
# Gradle and a Kotlin daemon on top, a release build stalled and the 16 GB CI
# runner shut down mid-build (PR #8, 2026-09-24), most likely out of memory.
# 4G + 2G leaves room for R8 and the Dart AOT compiler.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx2G
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
