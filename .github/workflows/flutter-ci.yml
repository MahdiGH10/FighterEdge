name: Flutter CI

# Every pull request, every push to main, and on demand. Job names are kept
# stable ("Analyze & test", "Golden tests (Windows renderer)", "Android
# release build", "Cloud Functions") so branch-protection rules keep matching.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fighter-edge-ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; main always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: fighter_edge

env:
  FLUTTER_VERSION: '3.47.2'
  NODE_VERSION: '22'
  # Line-coverage floor, excluding generated localizations. Raise it as
  # coverage grows; never lower it to get a PR through.
  MIN_COVERAGE: '80'

# Third-party actions are pinned to full commit SHAs (the version is in the
# comment); Dependabot keeps them current.
jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies (lockfile enforced)
        run: flutter pub get --enforce-lockfile

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Verify generated localizations are current
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n/gen || {
            echo "::error::lib/l10n/gen is stale. Run 'flutter gen-l10n' and commit the result."
            exit 1
          }

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests with coverage
        run: flutter test --exclude-tags golden --coverage --reporter github

      - name: Enforce coverage floor
        run: dart run tool/coverage_gate.dart coverage/lcov.info "$MIN_COVERAGE"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flutter-coverage
          path: fighter_edge/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  golden-tests:
    name: Golden tests (Windows renderer)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          # Windows cache post-cleanup can hold the job open after the tests
          # have passed; the golden gate is small enough to run uncached.
          cache: false

      - name: Install dependencies (lockfile enforced)
        run: flutter pub get --enforce-lockfile

      - name: Run golden tests
        run: flutter test --tags golden --reporter github

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: golden-failures
          path: fighter_edge/test/golden/failures
          if-no-files-found: ignore
          retention-days: 7

  functions:
    name: Cloud Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fighter_edge/functions
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: fighter_edge/functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and unit-test
        run: npm test

      - name: Audit production dependencies
        # Fails on high or critical advisories in what ships. The known
        # moderate uuid advisory (see the audit notes) is not reachable.
        run: npm audit --omit=dev --audit-level=high

  firestore-rules:
    name: Firestore rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fighter_edge/functions
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java (Firestore emulator)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: fighter_edge/functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run security-rules and billing-handler tests against the emulator
        run: npm run test:rules

  android-release:
    name: Android release build
    needs: [analyze-and-test]
    runs-on: ubuntu-latest
    # A cold Gradle cache with the notification/timezone/desugaring graph has
    # passed 20 minutes before (2026-09-18), and a new plugin empties the
    # cache; this is headroom, not the norm.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies (lockfile enforced)
        run: flutter pub get --enforce-lockfile

      - name: Generate release plugin configuration
        # Flutter 3.47 can leave integration_test (a dev-only plugin) in the
        # release registrant. The config-only pass regenerates it correctly.
        run: flutter build apk --config-only

      - name: Build obfuscated release APK
        # No upload key on PRs: the APK falls back to the debug key (see
        # android/app/build.gradle.kts). Store bundles are built only by the
        # release workflow, which requires the key.
        run: >-
          flutter build apk --release --no-pub
          --obfuscate --split-debug-info=build/symbols/android

      - name: Check native libraries are 16 KB page-aligned
        # Play requires this for every app update from November 2025; a
        # misaligned .so fails Play's pre-launch checks outright.
        run: |
          zipalign="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name zipalign | sort -V | tail -1)"
          "$zipalign" -c -P 16 -v 4 build/app/outputs/flutter-apk/app-release.apk

      - name: Upload release APK and symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fighter-edge-android-release
          path: |
            fighter_edge/build/app/outputs/flutter-apk/app-release.apk
            fighter_edge/build/symbols/android
          retention-days: 14

  integration-test:
    name: Integration test (Android emulator)
    needs: [analyze-and-test]
    # Skipped on draft PRs: emulator boot alone is several minutes.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    # Two emulator boots now, not one shared between both test files — see
    # the comment below on the run steps. +5 min for the second boot.
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free up disk space for the emulator's userdata partition
        # The first run failed here: "Not enough space to create userdata
        # partition. Available: 4848.20 MB, need 7372.80 MB." The runner's
        # preinstalled .NET SDK and Android NDK are several GB neither this
        # job nor this project needs.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc
          sudo docker image prune -af 2>/dev/null || true
          df -h /

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies (lockfile enforced)
        run: flutter pub get --enforce-lockfile

      - name: Generate debug plugin configuration
        run: flutter build apk --config-only --debug

      # Two emulator boots, one per test file, instead of one `flutter test
      # integration_test/` covering both: pointed at a directory, it reuses
      # a single long-lived emulator for every file it finds. This runner
      # has no real GPU — the emulator always renders through SwiftShader
      # software rendering (visible in its own launch args, `-gpu
      # swiftshader_indirect`) — and twice in a row, that one shared
      # instance died right as the *second* file (app_flow_test.dart, by
      # far the longer/heavier of the two) finished: both files' tests
      # passed (their own pass/fail output said so), but the emulator was
      # already unreachable by the time the action's own cleanup tried to
      # kill it, which failed the job anyway. A fresh emulator per file
      # avoids the accumulated memory/GPU-context pressure that's the most
      # likely trigger.
      # ram-size: app_flow_test.dart twice failed on a `ColorBuffer`
      # allocation error from the software (SwiftShader) GPU renderer at
      # the same step, ~170 buffers into the session both times —
      # consistent with a resource ceiling in the renderer, not a random
      # glitch. More RAM gives it headroom.
      #
      # cores is deliberately left at the action's default (2), NOT bumped
      # to 4: that was tried here and made things much worse. The emulator
      # logs "will run more smoothly with 4 CPU cores" on every run, but
      # this runner's KVM only actually has 2: raising `cores` to 4 made
      # qemu itself warn "Number of SMP cpus requested (4) exceeds the
      # recommended cpus supported by KVM (2)", and the run then hung on
      # oversubscribed vCPU threads ("detected a hanging thread 'QEMU2
      # CPU0 thread'. No response for 20205 ms") until GitHub killed the
      # runner outright. The message is real, but it's advice for a
      # differently-provisioned host, not this one.
      - name: Run the performance smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          working-directory: fighter_edge
          script: flutter test integration_test/performance_smoke_test.dart

      - name: Run the app flow test on a fresh emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          working-directory: fighter_edge
          script: flutter test integration_test/app_flow_test.dart

  ios-build:
    name: iOS build (no codesign)
    needs: [analyze-and-test]
    # Skipped on draft PRs: macOS minutes are the expensive ones.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies (lockfile enforced)
        run: flutter pub get --enforce-lockfile

      - name: Build iOS app without signing
        run: flutter build ios --release --no-codesign
