version: 2
updates:
  # Flutter/Dart packages. Minor and patch updates are grouped so they land
  # as one reviewable PR; majors arrive one by one.
  - package-ecosystem: pub
    directory: /fighter_edge
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      flutter-minor:
        update-types: [minor, patch]

  # Cloud Functions.
  - package-ecosystem: npm
    directory: /fighter_edge/functions
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      functions-minor:
        update-types: [minor, patch]

  # Keeps the SHA-pinned actions in the workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
